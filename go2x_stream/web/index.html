<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go2X 实时画面</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d11;
    --panel: #14171d;
    --border: #232833;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #182030 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 16px;
  }
  header {
    width: min(1280px, 100%);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .pill.warn .dot { background: var(--warn); }
  .pill.err .dot { background: var(--err); }
  .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stage {
    position: relative;
    width: min(1280px, 100%);
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
    background: #000;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .overlay .title { color: var(--text); font-size: 16px; }
  .overlay .detail { max-width: 640px; line-height: 1.6; word-break: break-word; }
  .spinner {
    width: 26px; height: 26px;
    border: 3px solid #2a3140;
    border-top-color: var(--ok);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { font-size: 12px; color: #5f6775; }
  .saybar {
    width: min(1280px, 100%);
    display: flex;
    gap: 10px;
  }
  #sayText {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #sayText:focus { border-color: var(--ok); }
  #sayBtn {
    padding: 10px 22px;
    border-radius: 10px;
    border: none;
    background: var(--ok);
    color: #06210f;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sayBtn:disabled { opacity: .55; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>Go2X 实时画面</h1>
    <span id="state" class="pill warn"><span class="dot"></span><span id="stateText">连接中</span></span>
    <span class="spacer"></span>
    <span id="meta" class="meta">--</span>
  </header>

  <div class="stage">
    <img id="video" src="/video" alt="Go2 视频流">
    <div id="overlay" class="overlay">
      <div class="spinner"></div>
      <div class="title">正在等待机器狗画面</div>
      <div id="detail" class="detail">服务会持续尝试连接 Go2，连接成功后自动显示。</div>
    </div>
  </div>

  <div class="saybar">
    <input id="sayText" type="text" placeholder="输入要播报的文字，回车或点「播报」" maxlength="200">
    <button id="sayBtn">播报</button>
  </div>

  <footer>数据每秒刷新一次 · 画面通过 MJPEG 实时推送</footer>

<script>
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const detail = document.getElementById('detail');
  const stateEl = document.getElementById('state');
  const stateText = document.getElementById('stateText');
  const meta = document.getElementById('meta');

  function setState(kind, text) {
    stateEl.className = 'pill ' + kind;
    stateText.textContent = text;
  }

  function reloadStream() {
    video.src = '/video?t=' + Date.now();
  }

  video.addEventListener('error', () => setTimeout(reloadStream, 2000));
  video.addEventListener('load', () => overlay.classList.add('hidden'));

  async function refresh() {
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      const s = await r.json();
      if (s.connected) {
        setState('ok', '已连接');
      } else if (s.error) {
        setState('err', '连接失败');
      } else {
        setState('warn', '连接中');
      }

      if (s.width && s.height) {
        meta.textContent = `${s.width} × ${s.height} · ${s.fps.toFixed(1)} fps · ${s.source}`;
      } else {
        meta.textContent = s.source;
      }

      if (s.error) {
        detail.textContent = s.error;
      } else if (!s.connected) {
        detail.textContent = '正在连接 ' + s.source + ' ...';
      }

      const hasFrame = s.frames > 0;
      overlay.classList.toggle('hidden', hasFrame);
    } catch (e) {
      setState('err', '服务不可用');
      detail.textContent = '无法访问本地服务，请确认进程仍在运行。';
    }
  }

  refresh();
  setInterval(refresh, 1000);

  const sayText = document.getElementById('sayText');
  const sayBtn = document.getElementById('sayBtn');

  async function doSay() {
    const text = sayText.value.trim();
    if (!text) { sayText.focus(); return; }
    sayBtn.disabled = true;
    sayBtn.textContent = '播报中…';
    try {
      const r = await fetch('/api/say', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        alert('播报失败：' + (data.detail || ('HTTP ' + r.status)));
      }
    } catch (e) {
      alert('请求失败：' + e.message);
    } finally {
      sayBtn.disabled = false;
      sayBtn.textContent = '播报';
    }
  }

  sayBtn.addEventListener('click', doSay);
  sayText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doSay();
  });
</script>
</body>
</html>
